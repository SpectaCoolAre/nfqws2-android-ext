IFACE_EXCLUDE="lo tun+ tap+ wg+ ppp+ ipsec+ ifb+ dummy+"
ISP_INTERFACE=""

# Zapret GUI (loop-uh, MIT): встроенный пресет 2.44 «Default + YouTube no QUIC
# + wssize» (копия в RixyPow/netzapret, presets/, 14.11.2026). Секции пресета —
# профилями модуля:
#   видео (googlevideo.com) — wssize 1:1 с самого SYN (имя по адресу из кэша,
#     --ipcache-hostname) и multidisorder по SNI с seqovl 1; QUIC к видео и
#     YouTube отбрасывается — плеер сразу идёт по TCP
#   сайт YouTube и сервисы Google (google.list) — multisplit 2, midsld-2 с
#     seqovl 1 из ClientHello tls7
#   Discord и Twitter/X — tls_multisplit_sni (17 точек вокруг имени, части
#     в обратном порядке; lua/zapret-custom.lua)
#   «Russia blacklist» (ваши списки и IP-список) — multidisorder по SNI с
#     seqovl 1; у пресета IP-список — своим рецептом tls_multisplit_sni, но
#     модуль ставит IP-списку рецепт общего профиля
#   Signal, Matrix, SimpleX, zapret.moe — hostfakesplit ozon.ru
#   звонки (STUN, Discord) — фейк из нулей
# Не перенесены секции Windows (WinDivert, game filter) и сайтов, для которых
# у модуля нет списков (Roblox, Tanki X, obsidian и т. п.)
NFQWS_BASE_ARGS="--ipcache-hostname=1
                 --ipcache-lifetime=8400
                 --lua-init=@$LUA_DIR/zapret-lib.lua
                 --lua-init=@$LUA_DIR/zapret-antidpi.lua
                 --lua-init=@$LUA_DIR/zapret-auto.lua
                 --lua-init=@$LUA_DIR/zapret-custom.lua
                 --blob=tls_google:@$BLOBS_DIR/tls_clienthello_www_google_com.bin
                 --blob=tls7:@$BLOBS_DIR/tls_clienthello_7.bin
                 --blob=fake_default_udp:0x00000000000000000000000000000000"

# Russia blacklist TCP 443
NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls
            --out-range=-d10
            --payload=tls_client_hello,http_req
            --lua-desync=multidisorder:pos=1,host+2,sld+2,sld+5,sniext+1,sniext+2,endhost-2:seqovl=1"

NFQWS_ARGS_QUIC=""

# Голосовые звонки/чаты
NFQWS_ARGS_UDP="--filter-udp=3478-3481,19294-19344,50000-65535 --filter-l7=stun,discord
                --out-range=-n8
                --payload=stun,discord_ip_discovery
                --lua-desync=fake:blob=fake_default_udp"

MODE_LIST="--hostlist=$LISTS_DIR/user.list"
MODE_ALL="--hostlist-exclude=$LISTS_DIR/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=$LISTS_DIR/auto.list --hostlist-auto-debug=$LOG_DIR/auto.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"
NFQWS_ARGS_IPSET="--ipset=$LISTS_DIR/ipset.list --ipset-exclude=$LISTS_DIR/ipset_exclude.list"

# YouTube · QUIC, YouTube · видео, YouTube · сайт, Бэкенд Google, Discord,
# Twitter/X, Signal/Matrix/SimpleX/zapret.moe
NFQWS_ARGS_CUSTOM="--filter-udp=443 --filter-l7=quic
                   --hostlist-domains=googlevideo.com,youtube.com,youtu.be,ytimg.com,ggpht.com,youtubei.googleapis.com,youtube.googleapis.com
                   --out-range=-n8
                   --payload=all
                   --lua-desync=drop
                   --new
                   --filter-tcp=80,443
                   --hostlist-domains=googlevideo.com
                   --out-range=-d8
                   --lua-desync=wssize:wsize=1:scale=1
                   --lua-desync=multidisorder:pos=1,host+2,sld+2,sld+5,sniext+1,sniext+2,endhost-2:seqovl=1
                   --new
                   --filter-tcp=80,443 --filter-l7=http,tls
                   --hostlist=$LISTS_DIR/google.list
                   --out-range=-d8
                   --lua-desync=multisplit:pos=2,midsld-2:seqovl=1:seqovl_pattern=tls7
                   --new
                   --filter-tcp=80,443,1080,2053,2083,2087,2096,8443 --filter-l7=http,tls
                   --hostlist=$LISTS_DIR/discord.list
                   --out-range=-d10
                   --lua-desync=tls_multisplit_sni:seqovl=652:seqovl_pattern=tls_google
                   --new
                   --filter-tcp=80,443 --filter-l7=http,tls
                   --ipset=$LISTS_DIR/ipset_twitter.list
                   --out-range=-d8
                   --lua-desync=tls_multisplit_sni:seqovl=652:seqovl_pattern=tls_google
                   --new
                   --filter-tcp=443 --filter-l7=tls
                   --hostlist-domains=signal.org,whispersystems.org,matrix.org,simplex.chat,zapret.moe
                   --out-range=-d8
                   --lua-desync=hostfakesplit:host=ozon.ru:tcp_ts=-1000:tcp_md5:repeats=4"

IPV6_ENABLED=1
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
UDP_PORTS=443,590:600,1400,3478:3481,5349,19294:19344,49152:65535
NFQUEUE_NUM=300

PKT_LIMIT_OUT=15
PKT_LIMIT_IN=15

BLOCK_QUIC=0
NAT_FIX=1
APP_MODE=off
AUTOSTART=1
WATCHDOG=1

NFQWS_USER=root
LOG_LEVEL=0
LOG_MAX_KB=512
