IFACE_EXCLUDE="lo tun+ tap+ wg+ ppp+ ipsec+ ifb+ dummy+"
ISP_INTERFACE=""

NFQWS_BASE_ARGS="--lua-init=@$LUA_DIR/zapret-lib.lua
                 --lua-init=@$LUA_DIR/zapret-antidpi.lua
                 --lua-init=@$LUA_DIR/zapret-auto.lua
                 --blob=quic_initial:@$BLOBS_DIR/quic_initial.bin
                 --blob=tls_clienthello:@$BLOBS_DIR/tls_clienthello.bin
                 --blob=quic_dbankcloud:@$BLOBS_DIR/quic_initial_dbankcloud_ru.bin"

NFQWS_ARGS="--filter-tcp=443,80,1984,2053,2083,2087,2096,5222,8443 --filter-l7=http,tls,mtproto
            --payload=tls_client_hello,mtproto_initial
            --lua-desync=circular:fails=2:time=300:retrans=3:nld=2
            # Strategy 1
            --lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=fonts.google.com:tcp_seq=10000:strategy=1
            --lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=1
            # Strategy 2
            --lua-desync=fake:blob=0x00000000:tcp_ack=-66000:tls_mod=rnd,dupsid,sni=www.google.com:repeats=2:strategy=2
            --lua-desync=multisplit:pos=1,midsld:strategy=2
            # Strategy 3
            --lua-desync=hostfakesplit:host=ozon.ru:midhost=host-2:seqovl=sniext+3:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:strategy=3
            --lua-desync=hostfakesplit:tcp_md5:tcp_ts_up:strategy=3
	    # Strategy 4
	    --lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=www.google.com:strategy=4
	    --lua-desync=hostfakesplit:host=www.google.com:altorder=1:fool=ts:strategy=4
            # HTTP
            --payload=http_req
            --lua-desync=http_methodeol:badsum"

NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic
                 --payload=quic_initial
                 --lua-desync=fake:blob=quic_initial:repeats=11"

NFQWS_ARGS_UDP="--filter-udp=590-600,1400,5349,49152-49999,50101-65535
                --filter-l7=wireguard,mtproto,unknown
                --out-range=<n2
                --payload=wireguard_initiation,wireguard_response,wireguard_cookie,mtproto_initial,unknown
                --lua-desync=circular:fails=2:time=300:retrans=3:nld=2
                 # Strategy 1
                --lua-desync=fake:blob=0x00000000:repeats=6:strategy=1
                 # Strategy 2
                --lua-desync=fake:blob=quic_initial:repeats=6:strategy=2"

MODE_LIST="--hostlist=$LISTS_DIR/user.list"
MODE_ALL="--hostlist-exclude=$LISTS_DIR/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=$LISTS_DIR/auto.list --hostlist-auto-debug=$LOG_DIR/auto.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"
NFQWS_ARGS_IPSET="--ipset=$LISTS_DIR/ipset.list --ipset-exclude=$LISTS_DIR/ipset_exclude.list"
NFQWS_ARGS_CUSTOM="--filter-udp=3478-3481,19294-19344,50000-50100 --filter-l7=discord,stun --lua-desync=fake:blob=quic_dbankcloud:repeats=6 --new
                   --filter-udp=3478-3481,19294-19344,50000-50100 --filter-l7=unknown --lua-desync=fake:blob=quic_dbankcloud:repeats=12:cutoff=n3"

IPV6_ENABLED=1
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
UDP_PORTS=443,590:600,1400,3478:3481,5349,19294:19344,49152:65535
NFQUEUE_NUM=300

PKT_LIMIT_OUT=15
PKT_LIMIT_IN=15

BLOCK_QUIC=0
NAT_FIX=1
APP_MODE=off
AUTOSTART=1
WATCHDOG=1

NFQWS_USER=root
LOG_LEVEL=0
LOG_MAX_KB=512
