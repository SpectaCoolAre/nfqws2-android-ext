# Умный режим: сам подбирает и запоминает обход для каждого сайта и каждой сети.
#
# Ничего не придумано с нуля: варианты — блоки авторских стратегий
# (MartinBacker, hardcorp74) и альтов Flowseal (alt10–alt13) из nfqws-menu.
# Перед вариантами стоит оркестратор smart (lua/zapret-smart.lua): начинает
# с самого успешного в этой сети варианта, при отказе пробует следующий,
# запоминает удачный за сайтом — отдельно для Wi‑Fi и мобильной сети.
# Выученное — в /data/adb/nfqws2/smart/<сеть>.tsv, сброс — в WebUI.
#
# Профили Cloudflare (tls_cf), хостингов и CDN с обрывом на 16 КБ (tls_16,
# quic_16) и хостингов по AS (tls_as) учатся отдельно от остальных сайтов:
# одному и тому же сайту там нужен свой обход (у MartinBacker — свой блок),
# и начинают они с того блока, который в этом профиле у MartinBacker.
# Набор вариантов у них тот же, что у tls (quic), — имена ниже общие.
#
# Варианты, которые умный режим перебирает (номер strategy=N). Основной
# набор (base= у оркестратора) и стартовые варианты (first=) — по двум
# отладочным замерам на МТС (Москва и область, октябрь 2026): каждый вариант на
# всех заблокированных сайтах. Лучшие в обоих замерах одни и те же —
# Zapret-2-GUI fake + seqovl (15), MartinBacker #1, #4, Cloudflare,
# DigitalOcean (1, 4, 6, 36), alt6, alt7 (22, 23), exp (33): по 73–83% сайтов.
# Один 15 открыл 25 из 30, вместе с MartinBacker #4 — 28. Ещё в наборе alt2,
# FAKE TLS AUTO ALT (19, 27 — по 50%) и MartinBacker #7 (5): они открывают
# сайты, на которых сдаются лучшие (svoboda.org, rferl.org, goodreads.com).
# Старт — по типу сайта: обычные — 15; Cloudflare — MartinBacker #4 (он, 15,
# alt6 и exp открыли все); хостинги с обрывом на 16 КБ — MartinBacker:
# Cloudflare (6, лучший там вместе с 36); хостинги по AS — MartinBacker:
# DigitalOcean (36). Google: hardcorp74, MartinBacker #1, alt13 — 100%, alt11,
# FAKE TLS AUTO и ALT — 80%; googlevideo-блок MartinBacker и alt10 (0 и 20%)
# ушли в пул. Ушли и TLS 2, 8–10, 12 (16–40%). Остальные — расширенный пул:
# части всех стратегий модуля (Flowseal alt–alt9, FAKE TLS AUTO, SIMPLE FAKE,
# krushaaa, eduncey, профиль MartinBacker для OVH). Он идёт в перебор, только
# когда включён в настройках разработчика (state/smart_pool), и всегда — в
# отладочном замере. Номера вариантов не меняются, и выученное с ними
# остаётся верным; сайт на варианте, ушедшем в пул, перейдёт на стартовый
