# Умный режим: сам подбирает и запоминает обход для каждого сайта и каждой сети.
#
# Ничего не придумано с нуля: варианты — блоки авторских стратегий
# (MartinBacker, hardcorp74) и альтов Flowseal (alt10–alt13) из nfqws-menu.
# Перед вариантами стоит оркестратор smart (lua/zapret-smart.lua): начинает
# с самого успешного в этой сети варианта, при отказе пробует следующий,
# запоминает удачный за сайтом — отдельно для Wi‑Fi и мобильной сети.
# Выученное — в /data/adb/nfqws2/smart/<сеть>.tsv, сброс — в WebUI.
#
# Варианты, которые умный режим перебирает (номер strategy=N):
#@tls 1 MartinBacker #1
#@tls 2 MartinBacker #2
#@tls 3 MartinBacker #3
#@tls 4 MartinBacker #4
#@tls 5 MartinBacker #7
#@tls 6 MartinBacker: Cloudflare
#@tls 7 MartinBacker: хостинги (16 КБ)
#@tls 8 hardcorp74 #1
#@tls 9 hardcorp74 #2
#@tls 10 hardcorp74 #3
#@tls 11 alt10
#@tls 12 alt11 / alt12
#@tls 13 alt13
#@tls 14 без обхода
#@google 1 hardcorp74: Google
#@google 2 MartinBacker: googlevideo
#@google 3 alt10: Google
#@google 4 alt11: Google
#@google 5 alt12: Google
#@google 6 MartinBacker #1
#@google 7 без обхода
#@quic 1 MartinBacker
#@quic 2 hardcorp74
#@quic 3 alt10
#@quic 4 alt11–alt13
#@quic 5 без обхода

IFACE_EXCLUDE="lo tun+ tap+ wg+ ppp+ ipsec+ ifb+ dummy+"
ISP_INTERFACE=""

ARGS_BLOCK16="--ipset=$LISTS_DIR/ipset.list --ipset=$LISTS_DIR/ipset_amazon.list --ipset-exclude=$LISTS_DIR/ipset_exclude.list"

NFQWS_BASE_ARGS="--lua-init=@$LUA_DIR/zapret-lib.lua
                 --lua-init=@$LUA_DIR/zapret-antidpi.lua
                 --lua-init=@$LUA_DIR/zapret-auto.lua
                 --lua-init=@$LUA_DIR/zapret-smart.lua
                 --blob=quic_initial:@$BLOBS_DIR/quic_initial.bin
                 --blob=quic_google:@$BLOBS_DIR/quic_initial_www_google_com.bin
                 --blob=quic_5ka:@$BLOBS_DIR/quic_initial_5ka_ru.bin
                 --blob=tls_clienthello:@$BLOBS_DIR/tls_clienthello.bin
                 --blob=tls_google:@$BLOBS_DIR/tls_clienthello_www_google_com.bin
                 --blob=tls_sferum:@$BLOBS_DIR/tls_clienthello_www_sferum_ru.bin
                 --blob=tls_sochi:@$BLOBS_DIR/tls_clienthello_sochi_park.bin
                 --blob=tls_4pda:@$BLOBS_DIR/tls_clienthello_4pda_to.bin
                 --blob=stun:@$BLOBS_DIR/stun.bin
                 --blob=stun2:@$BLOBS_DIR/stun2.bin"

# Оркестратор: видит первые входящие пакеты (до 19 КБ — дальше обрыва на
# 16 КБ), варианты — только исходящие
SMART_TCP="--out-range=-s34228 --in-range=-s19000"
SMART_UDP="--in-range=-n6"

# TLS и HTTP: по варианту на каждый блок источника. Одни и те же номера во
# всех профилях slot=tls — выученное для сайта общее
SMART_TLS="--in-range=x
           --payload=tls_client_hello
           # 1–5: MartinBacker (его 5-й и 6-й — с условиями, они в перебор не годятся)
           --lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=fonts.google.com:tcp_seq=10000:strategy=1
           --lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=1
           --lua-desync=fake:blob=0x00000000:tcp_ack=-66000:tls_mod=rnd,dupsid,sni=www.google.com:repeats=2:strategy=2
           --lua-desync=multisplit:pos=1,midsld:strategy=2
           --lua-desync=hostfakesplit:host=ozon.ru:midhost=host-2:seqovl=sniext+3:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:strategy=3
           --lua-desync=hostfakesplit:tcp_md5:tcp_ts_up:strategy=3
           --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=www.google.com:tcp_ts=-1000:strategy=4
           --lua-desync=multidisorder:pos=1,midsld,sniext+1,endhost-2,-10:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=4
           --lua-desync=multisplit:pos=1:seqovl=582:seqovl_pattern=stun:strategy=5
           # 6: MartinBacker, профиль Cloudflare
           --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=hcaptcha.com:tcp_ts=-1000:strategy=6
           --lua-desync=multidisorder:pos=1,midsld,sniext+1,endhost-2,-10:seqovl=1:seqovl_pattern=tls_sferum:tcp_ts_up:strategy=6
           # 7: MartinBacker, профиль хостингов (обрыв на 16 КБ)
           --lua-desync=multisplit:pos=1,midsld:seqovl=568:seqovl_pattern=stun:tcp_ts_up:strategy=7
           --lua-desync=multisplit:pos=1,sniext+1:seqovl=582:seqovl_pattern=stun:repeats=2-4:badsum:badseq:md5sig:tcp_ts_up:strategy=7
           --lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=www.google.com:tcp_ts=-1500:badsum:badseq:md5sig:tcp_md5:repeats=5:tcp_ts_up:strategy=7
           --lua-desync=hostfakesplit:host=www.google.com:midhost=midsld-2:repeats=4:ip_ttl=2:ip6_ttl=2:tcp_ts_up:strategy=7
           # 8–10: hardcorp74
           --lua-desync=fake:blob=tls_sochi:tls_mod=rnd,dupsid:tcp_ts=-1500:badsum:strategy=8
           --lua-desync=hostfakesplit:host=ozon.ru:midhost=host-2:seqovl=sniext+3:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:strategy=8
           --lua-desync=multisplit:pos=1,sniext-2:seqovl=1:seqovl_pattern=tls_sochi:strategy=8
           --lua-desync=fake:blob=stun:tcp_ts=-1500:badsum:strategy=9
           --lua-desync=fake:blob=tls_sochi:tls_mod=rnd,dupsid:tcp_ts=-1500:badsum:strategy=9
           --lua-desync=multisplit:pos=1,sniext-2:seqovl=1:seqovl_pattern=tls_sochi:strategy=9
           --lua-desync=hostfakesplit:midhost=host-2:seqovl=sniext+3:seqovl_pattern=tls_clienthello:badsum:tcp_md5:strategy=9
           --lua-desync=multidisorder:pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1:strategy=10
           --lua-desync=fake:blob=tls_sochi:optional:tcp_seq=-10000:tcp_ack=-66000:badsum:tls_mod=rnd,dupsid,sni=rzd.ru:repeats=4:strategy=10
           # 11–13: альты Flowseal
           --lua-desync=fake:blob=stun:repeats=6:tcp_ts=-600000:tcp_ts_up:strategy=11
           --lua-desync=fake:blob=tls_4pda:repeats=6:tcp_ts=-600000:tcp_ts_up:strategy=11
           --lua-desync=fake:blob=stun2:repeats=8:tcp_ts=-600000:tcp_ts_up:strategy=12
           --lua-desync=fake:blob=tls_sferum:repeats=8:tcp_ts=-600000:tcp_ts_up:strategy=12
           --lua-desync=multisplit:pos=1:seqovl=664:seqovl_pattern=tls_sferum:strategy=12
           --lua-desync=fake:blob=tls_sochi:repeats=5:tcp_ts=-600000:tcp_ts_up:strategy=13
           --lua-desync=fake:blob=stun2:repeats=5:tcp_ts=-600000:tcp_ts_up:strategy=13
           --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-600000:tcp_ts_up:strategy=13
           # 14: без обхода — для сайтов, которым обход только мешает
           --lua-desync=pass:strategy=14
           --payload=http_req
           --lua-desync=http_methodeol:badsum:strategy=1
           --lua-desync=http_methodeol:badsum:strategy=2
           --lua-desync=http_methodeol:badsum:strategy=3
           --lua-desync=http_methodeol:badsum:strategy=4
           --lua-desync=http_methodeol:badsum:strategy=5
           --lua-desync=http_methodeol:badsum:strategy=6
           --lua-desync=http_methodeol:badsum:strategy=7
           --lua-desync=fake:blob=tls_sochi:repeats=5:tcp_ts=-600000:tcp_ts_up:strategy=8
           --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-600000:tcp_ts_up:strategy=8
           --lua-desync=fake:blob=tls_sochi:repeats=5:tcp_ts=-600000:tcp_ts_up:strategy=9
           --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-600000:tcp_ts_up:strategy=9
           --lua-desync=fake:blob=tls_sochi:repeats=5:tcp_ts=-600000:tcp_ts_up:strategy=10
           --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-600000:tcp_ts_up:strategy=10
           --lua-desync=fake:blob=tls_sferum:repeats=6:tcp_ts=-600000:tcp_ts_up:strategy=11
           --lua-desync=fake:blob=tls_sferum:repeats=8:tcp_ts=-600000:tcp_ts_up:strategy=12
           --lua-desync=multisplit:pos=1:seqovl=664:seqovl_pattern=tls_sferum:strategy=12
           --lua-desync=fake:blob=tls_sochi:repeats=5:tcp_ts=-600000:tcp_ts_up:strategy=13
           --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-600000:tcp_ts_up:strategy=13
           --lua-desync=pass:strategy=14"

# Google и YouTube (google.list): первым — блок hardcorp74, проверенный на телефоне
SMART_GOOGLE="--in-range=x
              --payload=tls_client_hello
              --lua-desync=multidisorder:pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1:strategy=1
              --lua-desync=fake:blob=tls_sochi:optional:tcp_seq=-10000:tcp_ack=-66000:badsum:tls_mod=rnd,dupsid,sni=rzd.ru:tcp_ts_up:repeats=4:strategy=1
              --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=www.google.com:ip_id=zero:tcp_ts=-600000:tcp_ts_up:strategy=2
              --lua-desync=hostfakesplit:host=www.google.com:ip_id=zero:tcp_ts=-600000:tcp_ts_up:strategy=2
              --lua-desync=fake:blob=tls_google:repeats=6:ip_id=zero:tcp_ts=-600000:tcp_ts_up:strategy=3
              --lua-desync=fake:blob=tls_google:repeats=8:ip_id=zero:tcp_ts=-600000:tcp_ts_up:strategy=4
              --lua-desync=multisplit:pos=1:seqovl=681:seqovl_pattern=tls_google:ip_id=zero:strategy=4
              --lua-desync=hostfakesplit:host=www.google.com:ip_id=zero:tcp_ts=-600000:tcp_ts_up:strategy=5
              --lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=fonts.google.com:tcp_seq=10000:strategy=6
              --lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=6
              --lua-desync=pass:strategy=7"

SMART_QUIC="--in-range=x
            --payload=quic_initial
            --lua-desync=fake:blob=quic_initial:repeats=11:strategy=1
            --lua-desync=fake:blob=quic_5ka:repeats=6:strategy=2
            --lua-desync=fake:blob=quic_google:repeats=6:strategy=3
            --lua-desync=fake:blob=quic_google:repeats=11:strategy=4
            --lua-desync=pass:strategy=5"

SMART="smart:home=$CONFDIR"

NFQWS_ARGS="--filter-tcp=443,80,1984,5222 --filter-l7=http,tls,mtproto
            $SMART_TCP --lua-desync=$SMART:slot=tls:pass=14
            $SMART_TLS"

NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic
                 $SMART_UDP --lua-desync=$SMART:slot=quic:pass=5
                 $SMART_QUIC"

# Discord, звонки, игры — как у MartinBacker (свой перебор, без запоминания)
NFQWS_ARGS_UDP="--filter-udp=590-600,1400,3478-3481,5349,19294-19344,49152-65535
                --filter-l7=wireguard,stun,discord,mtproto,unknown
                --out-range=<n2
                --payload=wireguard_initiation,wireguard_response,wireguard_cookie,stun,discord_ip_discovery,mtproto_initial,unknown
                --out-range=-s34228
                --in-range=-s5556 --lua-desync=circular:fails=2:time=300:retrans=3:nld=2
                --in-range=x
                --lua-desync=fake:blob=quic_initial:repeats=6:strategy=1
                --lua-desync=fake:blob=0x00000000:repeats=6:strategy=2"

MODE_LIST="--hostlist=$LISTS_DIR/user.list"
MODE_ALL="--hostlist-exclude=$LISTS_DIR/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=$LISTS_DIR/auto.list --hostlist-auto-debug=$LOG_DIR/auto.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"
NFQWS_ARGS_IPSET=""

NFQWS_ARGS_CUSTOM="--filter-tcp=443 --filter-l7=tls
                   --hostlist=$LISTS_DIR/google.list
                   $SMART_TCP --lua-desync=$SMART:slot=google:pass=7
                   $SMART_GOOGLE
                   --new
                   --filter-udp=443 --filter-l7=quic
                   --hostlist=$LISTS_DIR/google.list
                   $SMART_UDP --lua-desync=$SMART:slot=quic:pass=5
                   $SMART_QUIC
                   --new
                   --filter-tcp=2053,2083,2087,2096,8443 --filter-l7=tls
                   --hostlist-domains=discord.media
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=tls_google:repeats=8:tcp_ts=-600000:tcp_ts_up
                   --lua-desync=multisplit:pos=1:seqovl=681:seqovl_pattern=tls_google
                   --new
                   --hostlist-domains=mobatek.net
                   --filter-tcp=443 --filter-l7=tls
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=fake_default_tls:tcp_md5:tls_mod=rnd,dupsid,padencap:repeats=1
                   --lua-desync=multisplit:pos=2 --payload=empty --out-range=<s1
                   --lua-desync=send:tcp_md5
                   --new
                   --ipset=$LISTS_DIR/ipset_do.list
                   --filter-tcp=443 --filter-l7=tls
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=ad.adriver.ru:tcp_ts=-1000
                   --lua-desync=multidisorder:pos=1,midsld,sniext+1,endhost-2,-10:seqovl=1:seqovl_pattern=tls_sferum:tcp_ts_up
                   --new
                   --ipset=$LISTS_DIR/ipset_cf_full.list
                   --filter-tcp=443,80 --filter-l7=tls,http
                   $SMART_TCP --lua-desync=$SMART:slot=tls:pass=14:first=6
                   $SMART_TLS
                   --new
                   $ARGS_BLOCK16 --ipset-ip=0.0.0.0
                   --filter-tcp=443,80 --filter-l7=tls,http
                   $SMART_TCP --lua-desync=$SMART:slot=tls:pass=14:first=7
                   $SMART_TLS
                   --new
                   $ARGS_BLOCK16 --ipset-ip=0.0.0.0
                   --filter-udp=443 --filter-l7=quic
                   $SMART_UDP --lua-desync=$SMART:slot=quic:pass=5
                   $SMART_QUIC
                   --new
                   --ipset=$LISTS_DIR/ipset_as_contabo.list
                   --ipset=$LISTS_DIR/ipset_as_creanova.list
                   --ipset=$LISTS_DIR/ipset_as_frantech.list
                   --ipset=$LISTS_DIR/ipset_as_iomart.list
                   --ipset=$LISTS_DIR/ipset_as_melbicom.list
                   --filter-tcp=443,80 --filter-l7=tls,http
                   $SMART_TCP --lua-desync=$SMART:slot=tls:pass=14:first=9
                   $SMART_TLS
                   --new
                   --ipset=$LISTS_DIR/ipset_ovh.list
                   --filter-tcp=443 --filter-l7=tls
                   --payload=tls_client_hello
                   --lua-desync=hostfakesplit:host=ya.ru:tcp_md5:badsum"

IPV6_ENABLED=1
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
UDP_PORTS=443,590:600,1400,3478:3481,5349,19294:19344,49152:65535
NFQUEUE_NUM=300

# Входящих 15 пакетов — около 20 КБ: оркестратору этого хватает, чтобы
# увидеть, прошло ли соединение дальше обрыва на 16 КБ
PKT_LIMIT_OUT=15
PKT_LIMIT_IN=15

BLOCK_QUIC=0
NAT_FIX=1
APP_MODE=off
AUTOSTART=1
WATCHDOG=1

NFQWS_USER=root
LOG_LEVEL=0
LOG_MAX_KB=512
