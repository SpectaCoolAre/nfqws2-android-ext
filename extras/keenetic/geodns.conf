# Настройки geodns — обход геоблока через DNS на роутере Keenetic (Entware).
# После правки: /opt/etc/init.d/S55geodns restart
#
# Серверы обхода — servers.list, группы сайтов (один сервер на всю группу) —
# groups.list, предпочтительные серверы групп — prefer.list, отключённые
# вручную — off.list. Первые три — те же файлы, что в модуле
# nfqws2-android-ext: выбор у роутера и у телефона одинаковый.

# DNS провайдера — для всего, что НЕ в списке геоблока. Пусто — geodns возьмёт
# его сам из настроек Keenetic (RCI). Можно через запятую.
PROVIDER_DNS=""

# Всё, что НЕ в списках, — через DoH (провайдер его не перехватит и не
# подменит). Пусто — DNS провайдера. Перестанет отвечать — geodns временно
# вернётся к DNS провайдера и сам переключится обратно.
DEFAULT_DOH="dns.google"
DEFAULT_PORT=5099

# Через какой DNS https-dns-proxy узнаёт адрес самого сервера обхода
BOOTSTRAP="77.88.8.8,1.1.1.1"

# Порт прокси сервера пула; серверам маршрутов — следующие (5054, 5055…)
PORT=5053

# Как часто, секунд: сторож (всё запущено, DNS отвечает); полная проверка
# серверов по всему списку; частая — основных сервисов и по факту
ALIVE_EVERY=60
SCAN_EVERY=14400
HOT_EVERY=1800
