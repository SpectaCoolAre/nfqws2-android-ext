# Обход блокировки звонков WhatsApp и Telegram. Включается тумблером
# «Обход звонков» и ставится перед стратегией, поэтому от неё не зависит.
#
# Звонки ломают по сигнатуре STUN: запросы, которыми приложения договариваются
# о голосовом канале (bol-van/zapret #1668, #1693, #1908; ntc.party
# «Блокировка Telegram и WhatsApp звонков»). Перед каждым STUN-пакетом уходит
# поддельный — DPI принимает решение по нему. Ретрансляторы WhatsApp — UDP 3478
# и 3482, Telegram — 590–600 и 1400; сигнальный канал WhatsApp — TCP 5222 и
# TLS к whatsapp.net. @META@ и @TG@ — сети Meta и Telegram из lib/common.sh.

# STUN к серверам Meta и Telegram на любом порту звонков
--filter-udp=590-1400,3478-3482
--filter-l7=stun
--ipset-ip=@META@,@TG@
--out-range=-n12
--payload=stun
--lua-desync=fake:blob=calls_stun:repeats=6
--new
# STUN на стандартных портах STUN/TURN — прямой звонок и чужие TURN-серверы
--filter-udp=3478-3482
--filter-l7=stun
--out-range=-n12
--payload=stun
--lua-desync=fake:blob=calls_stun:repeats=6
--new
# Ретрансляторы звонков Telegram: свой протокол, не STUN
--filter-udp=590-600,1400
--filter-l7=unknown
--ipset-ip=@TG@
--out-range=-n4
--payload=unknown
--lua-desync=fake:blob=calls_stun:repeats=4
--new
# Сигнальный канал WhatsApp по TLS: SNI режется по подстроке, делим имя
--filter-tcp=443
--filter-l7=tls
--hostlist-domains=whatsapp.net,whatsapp.com,wa.me,whatsapp.biz
--out-range=-d10
--payload=tls_client_hello
--lua-desync=multisplit:pos=1,midsld:seqovl=4:tcp_ts_up
--lua-desync=fake:blob=calls_tls:tcp_md5:tls_mod=rnd,dupsid,sni=ozon.ru:repeats=3
--new
# Запасной канал чата и голоса WhatsApp — TCP 5222 к Meta
--filter-tcp=5222
--ipset-ip=@META@
--out-range=-d10
--payload=all
--lua-desync=fake:blob=calls_tls:tcp_md5:tls_mod=rnd,dupsid,sni=ozon.ru:repeats=3
--lua-desync=multisplit:pos=1:seqovl=4:tcp_ts_up
