# Обход блокировки DoT/DoH: соединения с публичными DNS-серверами (порты 443 и
# 853, DoH3 — QUIC). Стратегия из nfqws-menu (dns_filter_nfqws2,
# https://github.com/rndnaame/nfqws-menu). Включается в «DNS по профилям» и
# ставится перед стратегией, поэтому от выбранной стратегии не зависит.
--filter-tcp=443,853
--filter-l7=http,tls
--hostlist-domains=dns.iij.jp,dot.sb,dns.sb,doh.sb,dns.google,dot.pub,doh.pub,controld.com,opendns.com,anycast.censurfridns.dk,dns.alidns.com,libredns.gr,cloudflare-dns.com,one.one.one.one,opennameserver.org,cleanbrowsing.org,dns.adguard-dns.com,dns.comss.one,xbox-dns.ru,dns.malw.link,geohide.ru,dns.nextdns.io,dns10.quad9.net,dns.quad9.net,dns.nullsproxy.com,dns.astracat.network,dns.bezmezhau.com,dns.dns-ai.ru,dns.mafioznik.xyz,freedns.controld.com
--out-range=-d10
--payload=tls_client_hello,http_req
--lua-desync=multisplit:pos=1,host+2,midsld+2,endsld-2:seqovl=4:tcp_ts_up
--lua-desync=fake:blob=doh_tls:tcp_md5:tcp_seq=10000:tls_mod=rnd,dupsid,sni=ozon.ru:repeats=3
