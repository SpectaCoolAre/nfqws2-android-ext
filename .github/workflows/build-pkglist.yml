name: build-pkglist

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-pkglist:
    name: Build pkglist.jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build pkglist
        run: bash .github/scripts/build-pkglist.sh build/pkglist

      - name: Upload pkglist
        uses: actions/upload-artifact@v4
        with:
          name: pkglist
          path: |
            build/pkglist/pkglist.jar
            build/pkglist/pkglist.dex
          if-no-files-found: error
