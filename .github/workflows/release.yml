# Выпуск релиза по тегу: git tag v2.0.1 && git push origin v2.0.1
# или вручную: Actions → release → Run workflow, указав версию (тег тогда
# создаётся на текущем коммите main).
#
# Один архив nfqws2-android-ext-vX.Y.Z.zip: модуль, nfqws2 под четыре ABI и
# AdGuard dnsproxy для DNS по профилям (версия и контрольные суммы — в
# .github/dnsproxy.lock). update.json в main обновляется здесь же: релиз,
# созданный токеном Actions, не запускает другие workflow.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Версия релиза, как в module.prop (например v2.0.1)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-binaries:
    uses: ./.github/workflows/build-binaries.yml

  release:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Версия в module.prop совпадает с тегом
        run: |
          ver=$(sed -n 's/^version=//p' module.prop | tr -d '\r')
          [ "$ver" = "$TAG" ] || { echo "::error::module.prop: version=$ver, а тег $TAG"; exit 1; }

      - name: Скачать собранные бинарники nfqws2
        uses: actions/download-artifact@v4
        with:
          pattern: nfqws2-*
          path: downloaded-binaries

      - name: Разместить собранные бинарники в модуль
        run: |
          for abi in android-arm android-arm64 android-x86 android-x86_64; do
            mkdir -p "binaries/$abi"
            cp -f "downloaded-binaries/nfqws2-$abi/nfqws2" "binaries/$abi/nfqws2"
            chmod 755 "binaries/$abi/nfqws2"
            ls -lh "binaries/$abi/nfqws2"
          done
          rm -rf downloaded-binaries

      - name: Добавить AdGuard dnsproxy
        run: |
          set -eu
          ver=$(awk '$1 == "VERSION" { print $2 }' .github/dnsproxy.lock)
          dl="$RUNNER_TEMP/dnsproxy"; mkdir -p "$dl" licenses
          grep -E '^android-' .github/dnsproxy.lock | while read -r abi asset sum; do
            f="$dl/$asset.tar.gz"
            curl -fsSL -o "$f" "https://github.com/AdguardTeam/dnsproxy/releases/download/$ver/dnsproxy-$asset-$ver.tar.gz"
            echo "$sum  $f" | sha256sum -c -
            tar -xzf "$f" -C "$dl"
            cp -f "$dl/$asset/dnsproxy" "binaries/$abi/dnsproxy"
            chmod 755 "binaries/$abi/dnsproxy"
            ls -lh "binaries/$abi/dnsproxy"
          done
          # Apache-2.0: лицензия едет вместе с бинарником
          cp -f "$dl/linux-arm64/LICENSE" licenses/dnsproxy-LICENSE

      - name: Собрать zip
        run: |
          set -eu
          out="nfqws2-android-ext-$TAG.zip"
          zip -q -r -9 -X "$out" \
            module.prop customize.sh service.sh action.sh uninstall.sh README.md LICENSE \
            bin binaries blobs defaults lib licenses lists lua strategies webroot
          unzip -l "$out" | tail -n 1
          echo "ZIP=$out" >> "$GITHUB_ENV"

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          LC_ALL: C.UTF-8
        run: |
          python3 -c "
          import sys, re
          text = open('changelog.md', encoding='utf-8').read()
          m = re.search(r'### [^\n]*' + re.escape(sys.argv[1]) + r':\s*([\s\S]*?)(?=### |\Z)', text)
          notes = m.group(1).strip() if m else text
          open('release-notes.md', 'w', encoding='utf-8').write(notes + '\n')
          " "$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$ZIP"; then echo "$ZIP уже приложен"
            else gh release upload "$TAG" "$ZIP"; fi
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Обновить update.json в main
        run: |
          set -eu
          git fetch origin main
          git checkout -B main origin/main
          code=$(git show "$GITHUB_SHA:module.prop" | sed -n 's/^versionCode=//p' | tr -d '\r')
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          log="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/changelog.md"
          jq -n --arg v "$TAG" --argjson c "$code" --arg z "$url/$ZIP" --arg l "$log" \
                '{version: $v, versionCode: $c, zipUrl: $z, changelog: $l}' > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet && exit 0
          git commit -m "update.json: $TAG"
          git push origin HEAD:main
